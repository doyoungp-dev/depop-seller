[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "depop_seller"
version = "1.1.3"
license = "MIT"
description = "Turn clothing photos into Depop listings: sort photos into items, write descriptions, fill in the listing form"
requires-python = ">=3.12"
dependencies = [
    "pillow>=11",
    "pillow-heif>=0.20",
    "anthropic>=0.60",
    "python-dotenv>=1.0",
    # the White Background cut-out model runs on it; on a Mac it only exists for Apple silicon on
    # macOS 14+ (Darwin 23), so other Macs install without it and the page says why
    "onnxruntime>=1.20; sys_platform != 'darwin' or (platform_machine == 'arm64' and platform_release >= '23')",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The automated-browser fallback for the Depop button, for people who cannot add the Chrome
# helper. Large, and Depop's bot protection blocks it, so neither the installer nor setup adds it.
automation = ["playwright>=1.50"]

[project.scripts]
depop = "depop_seller.cli:main"

[tool.setuptools.packages.find]
include = ["depop_seller*"]

[tool.setuptools.package-data]
depop_seller = ["static/*.html", "static/*.png", "static/*.ico", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
